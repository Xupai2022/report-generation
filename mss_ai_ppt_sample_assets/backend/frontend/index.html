<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSS AI PPT | 智能报告生成器</title>
    <link rel="icon" type="image/svg+xml" href="assets/sangfor_logo_vector.svg">
    
    <style>
        /* --- REFINED DESIGN SYSTEM - V2 --- */
        :root {
            /* ===== Color System - Cool Grays & A Professional Blue Accent ===== */
            --color-bg-base: #F7F7F8;           /* Page background */
            --color-bg-surface: #FFFFFF;        /* Main content surfaces (sidebars, canvas) */
            --color-bg-surface-2: #FDFDFD;      /* Slightly elevated surfaces */
            --color-bg-surface-hover: #F2F2F2;  /* Subtle hover for list items */
            --color-bg-modal: rgba(255, 255, 255, 0.85); /* Modal/glassy background */
            --color-bg-overlay: rgba(0, 0, 0, 0.05);

            --color-text-primary: #111827;      /* Main headings and text */
            --color-text-secondary: #4B5563;    /* Secondary text, labels */
            --color-text-tertiary: #6B7280;     /* Tertiary text, placeholders */
            --color-text-disabled: #9CA3AF;     /* Disabled state */
            --color-text-on-accent: #FFFFFF;    /* Text on primary buttons */

            /* Accent Color - A calm, professional blue */
            --color-accent: #2563EB;            /* Main brand color for actions */
            --color-accent-hover: #1D4ED8;      /* Hover state */
            --color-accent-active: #1E40AF;     /* Active/pressed state */
            --color-accent-light: #EFF6FF;      /* Light background for highlights */
            --color-accent-subtle: #DBEAFE;     /* Even more subtle bg */

            /* Semantic Colors - Clear & Accessible */
            --color-success: #16A34A;
            --color-success-bg: #F0FDF4;
            --color-warning: #F97316;
            --color-warning-bg: #FFF7ED;
            --color-error: #DC2626;
            --color-error-bg: #FEF2F2;
            --color-info: #3B82F6;
            --color-info-bg: #EFF6FF;

            /* Border System - Subtle & Clean */
            --color-border-primary: #E5E7EB;    /* Main borders for layout */
            --color-border-secondary: #F3F4F6;  /* Lighter borders for dividers */
            --color-border-focus: #3B82F6;      /* Focus ring color */

            /* Shadow System - Soft, Realistic Elevation */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-md: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.07);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.15);

            /* Radius System */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-full: 9999px;

            /* Spacing System (4px grid) */
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
            --space-12: 48px; --space-16: 64px;

            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);

            /* Layout Dimensions */
            --header-height: 60px;
            --toolbar-height: 72px;
            --sidebar-width: 260px;
            --editor-width: 360px;
        }

        /* ===== Global Resets & Base Styles ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--color-bg-base);
            color: var(--color-text-primary);
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        h1, h2, h3, h4, p { margin: 0; }
        button { font-family: inherit; }

        /* ===== Utility Classes ===== */
        .hidden { display: none !important; }
        .text-xs { font-size: 12px; }
        .text-sm { font-size: 13px; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ===== Scrollbar Styling ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: var(--radius-full); }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* ===== Main Layout Structure ===== */
        .app-layout { display: flex; flex-direction: column; height: 100vh; }
        .app-header {
            height: var(--header-height);
            background-color: var(--color-bg-surface);
            border-bottom: 1px solid var(--color-border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-6);
            flex-shrink: 0;
            z-index: 10;
        }
        .app-toolbar {
            height: var(--toolbar-height);
            background-color: var(--color-bg-surface-2);
            border-bottom: 1px solid var(--color-border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-6);
            flex-shrink: 0;
            z-index: 9;
        }
        .app-body {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
        }
        .app-sidebar, .app-editor {
            flex-shrink: 0;
            background-color: var(--color-bg-surface);
            display: flex;
            flex-direction: column;
        }
        .app-sidebar { width: var(--sidebar-width); border-right: 1px solid var(--color-border-primary); }
        .app-editor { width: var(--editor-width); border-left: 1px solid var(--color-border-primary); }
        .app-canvas {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--color-bg-base);
            background-image: radial-gradient(var(--color-text-tertiary) 0.5px, transparent 0.5px);
            background-size: 16px 16px;
            background-position: -8px -8px;
        }

        /* ===== Header Components ===== */
        .header-group { display: flex; align-items: center; gap: var(--space-4); }
        .logo-group { display: flex; align-items: center; gap: var(--space-3); }
        .logo-group img { height: 32px; }
        .logo-group .title-group { display: flex; flex-direction: column; }
        .logo-group .title-group h1 { font-size: 16px; font-weight: 600; color: var(--color-text-primary); }
        .logo-group .title-group span { font-size: 11px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
        .status-indicator { display: flex; align-items: center; gap: var(--space-2); font-size: 12px; color: var(--color-text-secondary); }
        .status-indicator .dot { width: 8px; height: 8px; background-color: var(--color-success); border-radius: 50%; }
        .lang-switcher button {
            background: none; border: none; padding: var(--space-1) var(--space-2); font-size: 13px;
            color: var(--color-text-secondary); cursor: pointer; border-radius: var(--radius-md); transition: var(--transition-fast);
        }
        .lang-switcher button:hover { background-color: var(--color-bg-surface-hover); color: var(--color-text-primary); }
        .lang-switcher button.active { background-color: var(--color-accent-light); color: var(--color-accent); font-weight: 500; }

        /* ===== Toolbar Components ===== */
        .toolbar-group { display: flex; align-items: center; gap: var(--space-6); }
        .toolbar-group .divider { width: 1px; height: 32px; background-color: var(--color-border-primary); }
        .toolbar-item { display: flex; flex-direction: column; gap: var(--space-1); }
        .toolbar-item label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em;}

        /* ===== General UI Components ===== */
        /* --- Buttons --- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
            font-size: 14px; font-weight: 500; padding: 0 var(--space-4); height: 36px;
            border-radius: var(--radius-md); border: 1px solid transparent;
            cursor: pointer; transition: var(--transition-fast);
        }
        .btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
        .btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .btn .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-primary {
            background-color: var(--color-accent); color: var(--color-text-on-accent);
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover:not(:disabled) { background-color: var(--color-accent-hover); }
        .btn-primary:active:not(:disabled) { background-color: var(--color-accent-active); }
        
        .btn-secondary {
            background-color: var(--color-bg-surface); color: var(--color-text-primary);
            border-color: var(--color-border-primary); box-shadow: var(--shadow-sm);
        }
        .btn-secondary:hover:not(:disabled) { background-color: var(--color-bg-surface-hover); border-color: #d1d5db; }
        .btn-secondary:active:not(:disabled) { background-color: #f3f4f6; }

        .btn-sm { height: 32px; padding: 0 var(--space-3); font-size: 13px; }

        /* --- Forms --- */
        select, input[type="text"], textarea {
            font-family: inherit; font-size: 14px; color: var(--color-text-primary);
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-primary);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }
        select:focus-visible, input[type="text"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; border-color: transparent;}
        select:hover, input[type="text"]:hover, textarea:hover { border-color: #d1d5db; }
        select { height: 36px; padding: 0 var(--space-3); min-width: 220px; }
        .checkbox-group { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
        .checkbox-group span { font-size: 13px; color: var(--color-text-secondary); }

        /* ===== Panel Headers & Content ===== */
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            height: 44px; padding: 0 var(--space-4);
            border-bottom: 1px solid var(--color-border-primary);
            flex-shrink: 0;
        }
        .panel-header h2 { font-size: 12px; font-weight: 600; color: var(--color-text-primary); text-transform: uppercase; letter-spacing: 0.05em;}
        .panel-content { flex-grow: 1; overflow-y: auto; padding: var(--space-2); }
        .panel-footer {
            display: flex; align-items: center; justify-content: space-between;
            height: 32px; padding: 0 var(--space-4); font-size: 11px;
            border-top: 1px solid var(--color-border-primary); color: var(--color-text-tertiary);
            flex-shrink: 0;
        }

        /* ===== Left Sidebar: Slide List ===== */
        .badge {
            background-color: var(--color-bg-surface-hover); color: var(--color-text-secondary);
            font-size: 11px; font-weight: 500; padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
        }
        .slide-item {
            display: flex; align-items: center; gap: var(--space-3);
            padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
            cursor: pointer; transition: background-color var(--transition-fast);
        }
        .slide-item:hover { background-color: var(--color-bg-surface-hover); }
        .slide-item.active { background-color: var(--color-accent-light); }
        .slide-item .slide-num {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            background-color: var(--color-bg-base); color: var(--color-text-secondary);
            border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
            transition: var(--transition-fast);
        }
        .slide-item.active .slide-num { background-color: var(--color-accent); color: var(--color-text-on-accent); }
        .slide-item .slide-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
        .slide-item .modified-indicator {
            width: 6px; height: 6px; background-color: var(--color-warning);
            border-radius: 50%; margin-left: auto; flex-shrink: 0;
        }

        /* ===== Left Sidebar: Logs ===== */
        .logs-section { flex-shrink: 0; border-top: 1px solid var(--color-border-primary); }
        .logs-toggle {
            width: 100%; height: 36px; padding: 0 var(--space-4); display: flex; align-items: center; justify-content: space-between;
            background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--color-text-secondary);
        }
        .logs-toggle:hover { background: var(--color-bg-surface-hover); }
        .logs-toggle .arrow { transition: transform var(--transition-fast); }
        .logs-toggle .arrow.open { transform: rotate(180deg); }
        .logs-container {
            height: 150px; background-color: #111827; color: #9ca3af; padding: var(--space-3);
            font-family: 'SF Mono', 'Consolas', 'Menlo', monospace; font-size: 12px; overflow-y: auto;
            display: none; line-height: 1.5;
        }
        .logs-container.open { display: block; }

        /* ===== Center Canvas ===== */
        .canvas-viewport {
            flex-grow: 1; padding: var(--space-8); overflow-y: auto;
        }
        .preview-list {
            display: flex; flex-direction: column; align-items: center; gap: var(--space-10);
        }
        .slide-view-item {
            width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: var(--space-3);
        }
        .slide-view-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--color-text-tertiary); }
        .preview-card {
            background-color: var(--color-bg-surface);
            box-shadow: var(--shadow-lg); border: 1px solid var(--color-border-primary);
            border-radius: var(--radius-lg); width: 100%; aspect-ratio: 16/9;
            object-fit: contain; display: block;
        }
        .placeholder-card {
            background-color: var(--color-bg-surface);
            box-shadow: var(--shadow-md); border: 1px dashed var(--color-border-primary);
            border-radius: var(--radius-lg); width: 100%; aspect-ratio: 16/9;
            display: flex; align-items: center; justify-content: center;
            color: var(--color-text-tertiary);
        }

        /* ===== Empty State ===== */
        .empty-state {
            height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: var(--space-4); color: var(--color-text-tertiary); text-align: center;
        }
        .empty-state .icon { font-size: 40px; line-height: 1; opacity: 0.5; }
        .empty-state h3 { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }

        /* ===== Right Editor Panel ===== */
        .editor-info {
            padding: var(--space-3) var(--space-4); background-color: var(--color-info-bg);
            border-bottom: 1px solid var(--color-border-primary);
            display: flex; align-items: flex-start; gap: var(--space-3);
        }
        .editor-info .icon { color: var(--color-info); flex-shrink: 0; }
        .editor-info .text { font-size: 12px; color: #1e40af; line-height: 1.5; }
        #slideJson {
            flex-grow: 1; width: 100%; resize: none; border: none;
            padding: var(--space-4); font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px;
            background-color: var(--color-bg-surface-2); line-height: 1.6;
        }
        #slideJson:focus { outline: none; }

        /* ===== Floating UI: Toast Notifications ===== */
        .toast-container {
            position: fixed; top: var(--space-4); right: var(--space-4); z-index: 999;
            display: flex; flex-direction: column; gap: var(--space-3);
        }
        .toast {
            width: 380px; display: flex; align-items: flex-start; gap: var(--space-3);
            background: var(--color-bg-surface); padding: var(--space-4);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-xl);
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } }
        .toast.removing { opacity: 0; transform: scale(0.95); transition: all 0.2s ease; }
        .toast-icon {
            width: 20px; height: 20px; flex-shrink: 0; font-weight: 500;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
        }
        .toast-content { display: flex; flex-direction: column; gap: var(--space-1); }
        .toast-title { font-weight: 600; color: var(--color-text-primary); }
        .toast-message { font-size: 13px; color: var(--color-text-secondary); }
        .toast-close {
            margin-left: auto; background: none; border: none; cursor: pointer;
            color: var(--color-text-tertiary); font-size: 16px;
        }
        .toast.toast-success .toast-icon { background-color: var(--color-success-bg); color: var(--color-success); }
        .toast.toast-error .toast-icon { background-color: var(--color-error-bg); color: var(--color-error); }
        .toast.toast-warning .toast-icon { background-color: var(--color-warning-bg); color: var(--color-warning); }
        .toast.toast-info .toast-icon { background-color: var(--color-info-bg); color: var(--color-info); }

        /* ===== Floating UI: Progress Panel ===== */
        .progress-panel {
            position: fixed; bottom: var(--space-4); right: var(--space-4); z-index: 998;
            width: 360px; background-color: var(--color-bg-modal);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-xl); box-shadow: var(--shadow-2xl);
            padding: var(--space-5);
            animation: slideInUp 0.3s ease; display: none;
        }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } }
        .progress-panel.active { display: block; }
        .progress-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
        .progress-panel-title { font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
        .progress-steps-compact { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-3); }
        .progress-step-compact { display: flex; align-items: center; gap: var(--space-3); font-size: 13px; transition: opacity 0.3s; }
        .progress-step-compact .step-icon-compact {
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; flex-shrink: 0; transition: all 0.3s;
        }
        .progress-step-compact .step-label-compact { font-weight: 500; }
        .progress-step-compact.pending { opacity: 0.4; }
        .progress-step-compact.pending .step-icon-compact { background: var(--color-border-primary); color: var(--color-text-tertiary); }
        .progress-step-compact.active .step-icon-compact { background: var(--color-accent); color: white; }
        .progress-step-compact.active .step-label-compact { color: var(--color-text-primary); }
        .progress-step-compact.completed { opacity: 0.7; }
        .progress-step-compact.completed .step-icon-compact { background: var(--color-success); color: white; }
        .progress-step-compact.completed .step-label-compact { text-decoration: line-through; }
        .step-spinner-compact { width: 12px; height: 12px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
        .progress-bar-compact { height: 6px; background: var(--color-bg-overlay); border-radius: var(--radius-full); overflow: hidden; margin: var(--space-2) 0;}
        .progress-bar-fill-compact {
            height: 100%; width: 0%; background: var(--color-accent);
            border-radius: var(--radius-full); transition: width 0.4s ease;
        }
        .progress-percentage-compact { text-align: right; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); }

        /* ===== Floating UI: Rating Card ===== */
        .rating-card {
            position: fixed; bottom: var(--space-4); right: var(--space-4); z-index: 998;
            width: 360px; background-color: var(--color-bg-surface); border-radius: var(--radius-xl);
            box-shadow: var(--shadow-2xl); border: 1px solid var(--color-border-primary);
            animation: slideInUp 0.3s ease;
        }
        .rating-card-header { padding: var(--space-4); border-bottom: 1px solid var(--color-border-primary); display: flex; justify-content: space-between; align-items: center; }
        .rating-card-header h4 { font-size: 16px; font-weight: 600; }
        .rating-card-close { background: none; border: none; font-size: 18px; color: var(--color-text-tertiary); cursor: pointer; }
        .rating-card-body { padding: var(--space-4); }
        .rating-card-body p { margin-bottom: var(--space-3); color: var(--color-text-secondary); }
        .rating-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-4); }
        .rating-btn {
            display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-3);
            border: 1px solid var(--color-border-primary); border-radius: var(--radius-lg); cursor: pointer; transition: var(--transition-base);
        }
        .rating-btn:hover { border-color: var(--color-accent); background-color: var(--color-accent-light); }
        .rating-btn.selected { border-color: var(--color-accent); background-color: var(--color-accent-light); box-shadow: 0 0 0 2px var(--color-accent-subtle); }
        .rating-icon { font-size: 24px; }
        #ratingCommentSection label { display: block; font-weight: 500; margin-bottom: var(--space-2); }
        #ratingCommentSection .rating-required { font-size: 12px; font-weight: 400; color: var(--color-error); margin-left: var(--space-2); }
        #ratingComment { width: 100%; min-height: 80px; padding: var(--space-3); }
        .rating-char-count { text-align: right; font-size: 12px; color: var(--color-text-tertiary); margin-top: var(--space-1); }
        .rating-actions { margin-top: var(--space-4); text-align: center; }
        .rating-error { margin-top: var(--space-3); padding: var(--space-3); background-color: var(--color-error-bg); color: var(--color-error); border-radius: var(--radius-md); }
    </style>
</head>
<body class="app-layout">

    <div id="toastContainer" class="toast-container"></div>

    <div id="progressPanel" class="progress-panel">
        <div class="progress-panel-header">
            <h3 class="progress-panel-title" data-i18n="msgGenerating">正在生成报告</h3>
        </div>
        <div class="progress-steps-compact" id="progressStepsCompact"></div>
        <div class="progress-bar-compact">
            <div class="progress-bar-fill-compact" id="progressBarFillCompact"></div>
        </div>
        <div class="progress-percentage-compact" id="progressPercentageCompact">0%</div>
    </div>

    <header class="app-header">
        <div class="header-group">

                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L3 14h9l-1 9 9-12h-9z"/></svg>

    <main class="app-body">
        <aside class="app-sidebar">

                <h2 data-i18n="sectionSlides">幻灯片列表</h2>

            <div class="logs-section">

        <section class="app-canvas">
            <div class="panel-header">
                <h2 id="activeSlideTitle" class="truncate">总览</h2>

                <div id="previewList" class="preview-list hidden"></div>

                    <p class="text-sm" style="max-width: 300px;" data-i18n="appDescription">我将为您自动分析数据、编排内容并生成结构清晰、视觉专业的PPT报告。</p>
                </div>

            <div class="panel-footer">

        <aside class="app-editor">

                <h2 data-i18n="editorTitle">JSON 属性编辑器</h2>
                <button id="rewriteBtn" class="btn btn-primary btn-sm">
                    <span data-i18n="btnApplyRegenerate">应用并重新生成</span>
                </button>

            <div class="editor-info">
                <span class="icon">ℹ️</span>
                <p class="text" data-i18n="editorHint">
                    <strong>编辑提示：</strong>只能修改字段的<strong>值</strong>，不能修改字段名。删除或重命名字段将被忽略。

    <div id="ratingCard" class="rating-card" style="display: none;">

            <h4 data-i18n="ratingTitle">为这份报告评分</h4>
            <button class="rating-card-close" onclick="closeRatingCard()">&times;</button>
        </div>
        <div class="rating-card-body">
            <p data-i18n="ratingPrompt">PPT已开始下载，请问这份报告是否基本可用？</p>
            <div class="rating-buttons">
                <button class="rating-btn" data-rating="liked" onclick="selectRating('liked')">
                    <span class="rating-icon">👍</span>

                <button class="rating-btn" data-rating="disliked" onclick="selectRating('disliked')">

                <textarea id="ratingComment" rows="3" maxlength="500" data-i18n-placeholder="ratingCommentPlaceholder"></textarea>

            </div>
            <div class="rating-actions" id="ratingActions">
                <button class="btn btn-primary" id="submitRatingBtn" onclick="submitRating()" style="display: none;" data-i18n="ratingSubmit">提交评分</button>

    <script>
        // --- i18n System ---
        let currentLang = localStorage.getItem('lang') || 'zh-CN';
        let translations = {};

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/i18n/${lang}.json`);
                translations = await response.json();
                return true;
            } catch (e) {
                console.error('Failed to load translations:', e);
                return false;
            }
        }

	        function t(key) {
	            return translations[key] || key;
	        }

	        function tf(key, params = {}) {
	            let template = t(key);
	            for (const [name, value] of Object.entries(params)) {
	                const token = `{${name}}`;
	                template = template.split(token).join(String(value));
	            }
	            return template;
	        }

        function switchLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            loadTranslations(lang).then(() => {
                updateUILanguage();
                updateLanguageButtonStyles();
            });
        }

        function updateLanguageButtonStyles() {
            document.getElementById('langBtnZh').classList.toggle('active', currentLang === 'zh-CN');
            document.getElementById('langBtnEn').classList.toggle('active', currentLang === 'en-US');
        }

        function updateUILanguage() {
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                // Handle strong tags inside translations
                const translation = t(key);
                const strongRegex = /<strong>(.*?)<\/strong>/g;
                if (strongRegex.test(translation)) {
                    el.innerHTML = translation;
                } else {
                    el.textContent = translation;
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });

            // Update title attributes (tooltips)
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                el.title = t(key);
            });

            // Update page title
            document.title = t('pageTitle');

            // Update progress steps
            if (state.progressSteps.length > 0) {
                updateProgressStepsLanguage();
            }

            // Update dropdowns if loaded
            updateInputDropdown();
            updateTemplateDropdown();

            // Update modified slides button
            updateModifiedSlidesUI();
        }

        function getTemplateNameTranslated(templateId, originalName) {
            // Map template IDs to translation keys
            const templateKeyMap = {
                'mss_executive_v2': 'templateExecutive',
                'mss_technical_v2': 'templateTechnical'
            };

            const key = templateKeyMap[templateId];
            if (key && translations[key]) {
                return translations[key];
            }
            return originalName; // Fallback to original name
        }

        function updateTemplateDropdown() {
            const tplSel = $('templateSelect');
            if (!tplSel || !window.cachedTemplates) return;

            const currentValue = tplSel.value;
            tplSel.innerHTML = `<option value="">${t('msgSelectTemplate')}</option>`;

            window.cachedTemplates.forEach(tpl => {
                const opt = document.createElement('option');
                opt.value = tpl.template_id;
                opt.textContent = getTemplateNameTranslated(tpl.template_id, tpl.name);
                tplSel.appendChild(opt);
            });

            // Restore selection
            if (currentValue) {
                tplSel.value = currentValue;
            }
        }

        function updateInputDropdown() {
            const inputSel = $('inputSelect');
            if (!inputSel || !window.cachedInputs) return;

            const currentValue = inputSel.value;
            inputSel.innerHTML = `<option value="">${t('msgSelectDataSource')}</option>`;

            window.cachedInputs.forEach(i => {
                const opt = document.createElement('option');
                opt.value = i.id;
                opt.textContent = `${i.tenant_name || i.id} (${i.period})`;
                inputSel.appendChild(opt);
            });

            // Restore selection
            if (currentValue) {
                inputSel.value = currentValue;
            }
        }

        function updateProgressStepsLanguage() {
            const stepTranslations = {
                'init': t('progressInit'),
                'load_template': t('progressLoadTemplate'),
                'generate_content': t('progressGenerateContent'),
                'render_ppt': t('progressRenderPpt'),
                'complete': t('progressComplete')
            };

            state.progressSteps.forEach(step => {
                if (stepTranslations[step.id]) {
                    step.label = stepTranslations[step.id];
                }
            });

            if (state.progressSteps.length > 0) {
                renderProgressSteps();
            }
        }

        const state = {
            jobId: null,
            slidespec: null,
            previews: [],
            activeSlideKey: null,
            loading: false,
            logsVisible: false,
            isClickScrolling: false, // flag to prevent intersection observer conflict
            websocket: null,
            clientId: null,
            sessionId: null,
            progressSteps: [],
            wsReady: false,  // Track if WebSocket is ready
            modifiedSlides: new Map()  // Track all modified slides: Map<slide_key, new_content>
        };

        const $ = (id) => document.getElementById(id);

        // --- Toast Notification System ---
        function showToast(message, options = {}) {
            const {
                type = 'info',  // 'success', 'error', 'warning', 'info'
                title = '',
                duration = 4000
            } = options;

            const container = $('toastContainer');
            const toastEl = document.createElement('div');
            toastEl.className = `toast toast-${type}`;

            const icons = { success: '✓', error: '✕', warning: '!', info: 'ℹ️' };

            toastEl.innerHTML = `
                <div class="toast-icon">${icons[type] || icons.info}</div>
                <div class="toast-content">
                    ${title ? `<div class="toast-title">${title}</div>` : ''}
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close">&times;</button>
            `;
            container.appendChild(toastEl);
            
            const remove = () => {
                toastEl.classList.add('removing');
                setTimeout(() => toastEl.remove(), 200);
            };

            toastEl.querySelector('.toast-close').onclick = remove;
            if (duration > 0) {
                setTimeout(remove, duration);
            }
        }
        const toast = {
            success: (message, title) => showToast(message, { type: 'success', title }),
            error: (message, title) => showToast(message, { type: 'error', title, duration: 6000 }),
            warning: (message, title) => showToast(message, { type: 'warning', title }),
            info: (message, title) => showToast(message, { type: 'info', title })
        };

        // --- WebSocket Connection ---
        function initWebSocket() {
            state.clientId = 'client_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${state.clientId}`;
            console.log('Connecting to WebSocket:', wsUrl);

            state.websocket = new WebSocket(wsUrl);
            state.websocket.onopen = () => { console.log('WebSocket connected'); state.wsReady = true; };
            state.websocket.onerror = (error) => { console.error('WebSocket error:', error); state.wsReady = false; };
            state.websocket.onclose = () => {
                console.log('WebSocket closed, reconnecting in 3s...');
                state.wsReady = false;
                setTimeout(initWebSocket, 3000);
            };
            state.websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WS <<', data);
                switch(data.type) {
                    case 'progress':
                        updateProgress(data.progress, data.message, data.details);
                        break;
                    case 'step_update':
                        updateStep(data.step_id, data.status, data.message);
                        break;
                    case 'completed':
                        handleGenerationComplete(data.result);
                        break;
                    case 'failed':
                        handleGenerationFailed(data.result);
                        break;
                }
            };
        }

        // --- Progress UI Management ---
        const PROGRESS_STEPS = [
            { id: 'init', label: 'progressInit' }, { id: 'load_template', label: 'progressLoadTemplate' },
            { id: 'generate_content', label: 'progressGenerateContent' }, { id: 'render_ppt', label: 'progressRenderPpt' },
            { id: 'complete', label: 'progressComplete' }
        ];

        function showProgressPanel() {
            state.progressSteps = PROGRESS_STEPS.map(s => ({ ...s, status: 'pending' }));
            renderProgressSteps();
            $('progressPanel').classList.add('active');
            updateProgressBar(0);
        }

        function hideProgressPanel() {
            setTimeout(() => {
                $('progressPanel').classList.remove('active');
            }, 3000);
        }

        function renderProgressSteps() {
            const container = $('progressStepsCompact');
            container.innerHTML = state.progressSteps.map((step, idx) => `
                <div class="progress-step-compact ${step.status}" data-step-id="${step.id}">
                    <div class="step-icon-compact">
                        ${step.status === 'active' ? '<div class="step-spinner-compact"></div>' :
                          step.status === 'completed' ? '✓' : (idx + 1)}
                    </div>
                    <div class="step-label-compact">${t(step.label)}</div>
                </div>
            `).join('');
        }

        function updateStep(stepId, status) {
            const step = state.progressSteps.find(s => s.id === stepId);
            if (step) { step.status = status; renderProgressSteps(); }
        }

        function updateProgress(progress) {
            updateProgressBar(progress);
            let currentStepIndex = 0;
            if (progress < 20) currentStepIndex = 0;
            else if (progress < 30) currentStepIndex = 1;
            else if (progress < 70) currentStepIndex = 2;
            else if (progress < 90) currentStepIndex = 3;
            else currentStepIndex = 4;

            for (let i = 0; i < currentStepIndex; i++) {
                if (state.progressSteps[i].status !== 'completed') state.progressSteps[i].status = 'completed';
            }
            if (state.progressSteps[currentStepIndex]) state.progressSteps[currentStepIndex].status = 'active';
            renderProgressSteps();
        }

        function updateProgressBar(progress) {
            $('progressBarFillCompact').style.width = progress + '%';
            $('progressPercentageCompact').textContent = Math.round(progress) + '%';
        }

        async function handleGenerationComplete(result) {
            state.progressSteps.forEach(s => s.status = 'completed');
            renderProgressSteps();
            updateProgressBar(100);
            
            state.modifiedSlides.clear();
            state.sessionId = null; // Clear session for next run
            console.log('Job completed, cleared session_id.');

            if (result.job_id) {
                state.jobId = result.job_id;
                state.slidespec = result.slidespec;
                $('jobIdDisplay').textContent = `${t('msgJobId')}: ${result.job_id}`;
                syncActionButtons();
                state.activeSlideKey = result.slidespec?.slides?.[0]?.slide_key;
                renderSlides();
                renderPreviewList();
                if (state.activeSlideKey) {
                    const slide = state.slidespec.slides.find(s => s.slide_key === state.activeSlideKey);
                    if (slide) $('slideJson').value = JSON.stringify(slide.placeholders || {}, null, 2);
                }

                // Fetch previews after a short delay
                setTimeout(async () => {
                    try {
                        console.log('Fetching previews for job:', result.job_id);
                        const prevRes = await api(`/api/v1/reports/${encodeURIComponent(result.job_id)}/preview?regenerate_if_missing=true`);
                        console.log('Preview API response:', prevRes);
                        const prevData = prevRes.data || prevRes;
                        console.log('Preview data:', prevData);
                        state.previews = prevData.preview_urls || prevData.images || [];
                        console.log('Extracted previews:', state.previews);
                        renderPreviewList();
                        updateActiveState(state.activeSlideKey, true);
                    } catch (e) { console.error('Failed to load previews:', e); }
                }, 500);
            }
            hideProgressPanel();
        }

	    function handleGenerationFailed(result) {
            state.sessionId = null;
            console.log('Job failed, cleared session_id for retry.');
	        toast.error(result.error || t('errorUnknown'), t('msgError'));
	        hideProgressPanel();
	    }

        function checkAndRestoreCooldown() {
            const cooldownEnd = parseInt(localStorage.getItem('generateCooldownEnd') || '0');
            const now = Date.now();
            if (cooldownEnd > now) {
                const btn = $('generateBtn');
                const updateCountdown = () => {
                    const remaining = Math.ceil((parseInt(localStorage.getItem('generateCooldownEnd') || '0') - Date.now()) / 1000);
                    const btnTextSpan = btn.querySelector('[data-i18n="btnGenerate"]');
                    if (remaining > 0) {
                        if(btnTextSpan) btnTextSpan.textContent = `${t('btnGenerate')} (${remaining}s)`;
                        setTimeout(updateCountdown, 1000);
                    } else {
                        if(btnTextSpan) btnTextSpan.textContent = t('btnGenerate');
                    }
                };
                updateCountdown();
            }
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
            if (!res.ok) {
                const errorData = await res.json().catch(() => null);
                const error = new Error(errorData?.error?.message || res.statusText);
                error.data = errorData;
                throw error;
            }
            return await res.json();
        }

        async function init() {
            await loadTranslations(currentLang);
            updateUILanguage();
            updateLanguageButtonStyles();
            initWebSocket();
            checkAndRestoreCooldown();
            try {
                const [tplsResp, inputsResp] = await Promise.all([
                    api('/api/v1/templates'),
                    api('/api/v1/inputs'),
                ]);
                window.cachedTemplates = tplsResp.data || tplsResp;
                window.cachedInputs = inputsResp.data || inputsResp;
                updateInputDropdown();
                updateTemplateDropdown();
            } catch (e) { console.error(e); }
        }

        const observer = new IntersectionObserver((entries) => {
            if (state.isClickScrolling) return;
            const intersecting = entries.find(e => e.isIntersecting);
            if (intersecting) {
                const key = intersecting.target.dataset.key;
                if (key && key !== state.activeSlideKey) {
                    updateActiveState(key, false);
                }
            }
        }, { root: $('canvasViewport'), threshold: 0.5 });

        function renderLogs(lines) {
            const container = $('logsContent');
            container.innerHTML = lines.map((l, i) => `<div><span style="opacity:0.3; margin-right:8px;">${i+1}</span>${l}</div>`).join('');
            container.scrollTop = container.scrollHeight;
        }

        function renderSlides() {
            const list = $('slidesList');
            const slides = state.slidespec?.slides || [];
            $('slideCount').textContent = slides.length;
            if (!slides.length) {
                list.innerHTML = `<div class="empty-state"><div class="icon">📄</div><p class="text-sm font-medium" data-i18n="msgNoData">暂无幻灯片</p></div>`; return;
            }
            list.innerHTML = slides.map((s, idx) => `
                <div class="slide-item" data-key="${s.slide_key}">
                    <div class="slide-num">${idx + 1}</div>
                    <div class="slide-title truncate">${s.slide_key}</div>
                    ${state.modifiedSlides.has(s.slide_key) ? '<div class="modified-indicator"></div>' : ''}
                </div>`).join('');
            list.querySelectorAll('.slide-item').forEach(el => {
                el.onclick = () => updateActiveState(el.dataset.key, true);
            });
            highlightSidebar(state.activeSlideKey);
        }

        function renderPreviewList() {
            const list = $('previewList');
            const slides = state.slidespec?.slides || [];
            console.log('renderPreviewList called, slides:', slides.length, 'previews:', state.previews.length);
            observer.disconnect();
            if (!slides.length) {
                list.classList.add('hidden');
                $('emptyState').classList.remove('hidden');
                return;
            }
            list.innerHTML = slides.map((s, idx) => {
                const imgUrl = state.previews[idx];
                console.log(`Slide ${idx}: key=${s.slide_key}, imgUrl=${imgUrl}`);
                return `
                <div class="slide-view-item" id="view-${s.slide_key}" data-key="${s.slide_key}">
                    <div class="slide-view-label"><span>${t('msgPageNumber')} ${idx+1}</span> <span>${s.slide_key}</span></div>
                    ${imgUrl ? `<img src="${imgUrl}?t=${Date.now()}" class="preview-card" loading="lazy">` :
                               `<div class="placeholder-card">${t('msgGeneratingPreview')}</div>`}
                </div>`;
            }).join('');
            list.querySelectorAll('.slide-view-item').forEach(el => observer.observe(el));
            $('emptyState').classList.add('hidden');
            list.classList.remove('hidden');
        }

        function highlightSidebar(key) {
            document.querySelectorAll('.slide-item').forEach(el => {
                const isActive = el.dataset.key === key;
                el.classList.toggle('active', isActive);
                if (isActive) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        }

        function updateActiveState(key, scrollRightView) {
            if (state.activeSlideKey && state.activeSlideKey !== key) {
                saveCurrentSlideModifications();
            }
            state.activeSlideKey = key;
            highlightSidebar(key);
            $('activeSlideTitle').textContent = key;
            const slide = state.slidespec.slides.find(s => s.slide_key === key);
            if (slide) {
                const editorContent = state.modifiedSlides.get(key) || slide.placeholders || {};
                $('slideJson').value = JSON.stringify(editorContent, null, 2);
            }
            updateModifiedSlidesUI();
            if (scrollRightView) {
                const viewItem = $(`view-${key}`);
                if (viewItem) {
                    state.isClickScrolling = true;
                    viewItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => { state.isClickScrolling = false; }, 800);
                }
            }
        }

        function saveCurrentSlideModifications() {
            if (!state.activeSlideKey) return;
            try {
                const editedContent = JSON.parse($('slideJson').value);
                const slide = state.slidespec.slides.find(s => s.slide_key === state.activeSlideKey);
                if (!slide) return;
                const originalContent = slide.placeholders || {};
                const protectedContent = {};
                for (const originalKey in originalContent) {
                    protectedContent[originalKey] = (originalKey in editedContent) ? editedContent[originalKey] : originalContent[originalKey];
                }
                const addedKeys = Object.keys(editedContent).filter(k => !(k in originalContent));
                if (addedKeys.length > 0) {
                    toast.warning(tf('msgIgnoredAddedFields', { fields: addedKeys.join(', ') }), t('toastTitleHint'));
                }
                if (JSON.stringify(protectedContent) !== JSON.stringify(originalContent)) {
                    state.modifiedSlides.set(state.activeSlideKey, protectedContent);
                } else {
                    state.modifiedSlides.delete(state.activeSlideKey);
                }
            } catch (e) {
                toast.error(t('errorInvalidJsonCannotSave'), t('titleSaveFailed'));
            }
        }
        
        function updateModifiedSlidesUI() {
            const count = state.modifiedSlides.size;
            const btn = $('rewriteBtn');
            const btnText = btn.querySelector('[data-i18n="btnApplyRegenerate"]');
            if (count > 0) {
                btnText.textContent = `${t('btnApplyRegenerate')} (${count})`;
                btn.style.setProperty('--btn-bg', 'var(--color-warning)'); // A way to change color
            } else {
                btnText.textContent = t('btnApplyRegenerate');
                btn.style.setProperty('--btn-bg', 'var(--color-accent)');
            }
            renderSlides(); // Re-render to show/hide indicators
        }

        function setLoading(flag) {
            state.loading = flag;
            syncActionButtons();
            $('genIcon').classList.toggle('hidden', flag);
            $('genSpinner').classList.toggle('hidden', !flag);
        }

        function syncActionButtons() {
            $('generateBtn').disabled = state.loading;
            $('rewriteBtn').disabled = state.loading || !state.jobId;
            $('downloadBtn').disabled = state.loading || !state.jobId;
            $('downloadPdfBtn').disabled = state.loading || !state.jobId;
        }

        $('generateBtn').onclick = async () => {
            const iId = $('inputSelect').value;
            const tId = $('templateSelect').value;
            if (!iId || !tId) { return toast.warning(t('msgSelectDataAndTemplate'), t('toastTitleHint')); }

            const cooldownEnd = parseInt(localStorage.getItem('generateCooldownEnd') || '0');
            if (cooldownEnd > Date.now()) { return toast.warning(`${t('msgRequestTooFrequent')}${Math.ceil((cooldownEnd - Date.now())/1000)}${t('msgRetryIn')}`); }

            if (!state.wsReady) {
                console.warn('WebSocket not ready, retrying...');
                await new Promise(resolve => setTimeout(resolve, 500));
                if(!state.wsReady) return toast.error(t('errorWebSocketConnection'), t('msgError'));
            }

            if (!state.sessionId) {
                // Generate session ID matching backend format: {uuid8}_{timestamp20}
                // Example: a3f2c5d8_20250129143025123456
                const uuid8 = Array.from({length: 8}, () => Math.floor(Math.random() * 16).toString(16)).join('');
                const now = new Date();
                const timestamp20 = [
                    now.getFullYear(),
                    String(now.getMonth() + 1).padStart(2, '0'),
                    String(now.getDate()).padStart(2, '0'),
                    String(now.getHours()).padStart(2, '0'),
                    String(now.getMinutes()).padStart(2, '0'),
                    String(now.getSeconds()).padStart(2, '0'),
                    String(now.getMilliseconds() * 1000).padStart(6, '0')  // Convert ms to microseconds (6 digits)
                ].join('');
                state.sessionId = `${uuid8}_${timestamp20}`;
                console.log('Generated new session_id:', state.sessionId);
            }
            
            showProgressPanel();
            
            const COOLDOWN_SECONDS = 30;
            localStorage.setItem('generateCooldownEnd', Date.now() + COOLDOWN_SECONDS * 1000);
            checkAndRestoreCooldown();
            
            setLoading(true);
            try {
                await doGenerate(iId, tId, $('useMock').checked);
            } catch (e) {
                console.error(e);
                localStorage.removeItem('generateCooldownEnd');
                checkAndRestoreCooldown();
                if (e.data?.error?.auto_retry_with_mock) {
                    await doGenerate(iId, tId, true);
                } else {
                    handleGenerationFailed({ error: e.message });
                }
            } finally {
                setLoading(false);
            }
        };

        async function doGenerate(inputId, templateId, useMock) {
            const res = await api('/api/v1/reports', {
                method: 'POST',
                body: JSON.stringify({
                    input_id: inputId, template_id: templateId, use_mock: useMock,
                    session_id: state.sessionId, client_id: state.clientId, idempotency_key: state.sessionId
                })
            });
            const result = res.data || res;
            if (result.status === 'running') {
                toast.info(t('msgGeneratingPleaseWait'), t('toastTitleHint'));
            } else if (result.status === 'completed' && result.from_cache) {
                toast.success(t('msgUsingCachedResult'), t('toastTitleHint'));
                handleGenerationComplete(result);
            }
        }

        $('downloadBtn').onclick = () => {
            if (!state.jobId) return;
            window.location.href = `/api/v1/reports/${encodeURIComponent(state.jobId)}/download?regenerate_if_missing=true`;
            setTimeout(() => showRatingCard(state.jobId), 1000);
        };

        $('downloadPdfBtn').onclick = () => {
            if (!state.jobId) return;
            window.location.href = `/api/v1/reports/${encodeURIComponent(state.jobId)}/download-pdf?regenerate_if_missing=true`;
            setTimeout(() => showRatingCard(state.jobId), 1000);
        };

        $('rewriteBtn').onclick = async () => {
            if (!state.jobId) return;
            saveCurrentSlideModifications();
            if (state.modifiedSlides.size === 0) { return toast.warning(t('msgNoChangesToApply'), t('toastTitleHint')); }

            setLoading(true);
            try {
                const slidesArray = Array.from(state.modifiedSlides.entries()).map(([slide_key, new_content]) => ({ slide_key, new_content }));
                const res = await api(`/api/v1/reports/${encodeURIComponent(state.jobId)}/slides`, {
                    method: 'PATCH', body: JSON.stringify({ slides: slidesArray })
                });
                const result = res.data || res;
                if (result.slidespec) state.slidespec = result.slidespec;
                state.modifiedSlides.clear();
                updateModifiedSlidesUI();
                const prevRes = await api(`/api/v1/reports/${encodeURIComponent(state.jobId)}/preview?regenerate_if_missing=true`);
                const prevData = prevRes.data || prevRes;
                state.previews = prevData.preview_urls || prevData.images || [];
                renderPreviewList();
                const slide = state.slidespec.slides.find(s => s.slide_key === state.activeSlideKey);
                if (slide) $('slideJson').value = JSON.stringify(slide.placeholders || {}, null, 2);
                toast.success(tf('msgUpdateSlidesSuccess', { count: result.updated_count || 0 }), t('titleUpdateCompleted'));
            } catch(e) {
                toast.error(e.message, t('titleUpdateFailed'));
            } finally {
                setLoading(false);
            }
        };

        $('toggleLogsBtn').onclick = () => {
            const c = $('logContainer');
            const a = $('logArrow');
            const isOpen = c.classList.toggle('open');
            a.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        $('refreshPreviewBtn').onclick = async () => {
            if (!state.jobId) return;
            try {
                const prevRes = await api(`/api/v1/reports/${encodeURIComponent(state.jobId)}/preview?regenerate_if_missing=true`);
                const prevData = prevRes.data || prevRes;
                state.previews = prevData.preview_urls || prevData.images || [];
                renderPreviewList();
            } catch (e) { console.error('Failed to refresh previews:', e); }
        };

        let ratingState = { selectedRating: null, jobId: null, ratedJobs: new Set() };
        function showRatingCard(jobId) {
            if (ratingState.ratedJobs.has(jobId)) return;
            ratingState.jobId = jobId;
            ratingState.selectedRating = null;
            $('ratingCard').style.display = 'block';
            // Reset UI
            document.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('selected'));
            $('ratingCommentSection').style.display = 'none';
            $('submitRatingBtn').style.display = 'none';
        }
        function closeRatingCard() { $('ratingCard').style.display = 'none'; }
        function selectRating(rating) {
            ratingState.selectedRating = rating;
            document.querySelectorAll('.rating-btn').forEach(btn => btn.classList.toggle('selected', btn.dataset.rating === rating));
            if (rating === 'disliked') {
                $('ratingCommentSection').style.display = 'block';
                $('submitRatingBtn').style.display = 'inline-block';
                $('submitRatingBtn').disabled = $('ratingComment').value.length < 10;
            } else {
                submitRating();
            }
        }
        async function submitRating() {
            const { selectedRating, jobId } = ratingState;
            const comment = $('ratingComment').value.trim();
            if (!selectedRating) return;
            if (selectedRating === 'disliked' && comment.length < 10) {
                return showRatingError(t('ratingErrorCommentTooShort'));
            }
            try {
                await api(`/api/v1/ratings/jobs/${encodeURIComponent(jobId)}/rating`, {
                    method: 'POST', body: JSON.stringify({ rating: selectedRating, comment: comment || null })
                });
                ratingState.ratedJobs.add(jobId);
                toast.success(t('ratingSuccessMessage'));
                closeRatingCard();
            } catch (error) { showRatingError(error.message); }
        }
        function showRatingError(message) {
            const errorDiv = $('ratingError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        $('ratingComment').addEventListener('input', function() {
            const count = this.value.length;
            $('ratingCharCount').textContent = count;
            if (ratingState.selectedRating === 'disliked') {
                $('submitRatingBtn').disabled = count < 10;
            }
        });

        init();
    </script>
</body>
</html>
